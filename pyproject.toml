[project]
name = "jaano"
version = "0.1.0"
description = "Make a long screen recording answerable: a timestamped transcript indexes the video, frames are retrieved on demand."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    # Direct since frames.py: it was already here transitively, but a module
    # that imports it is a module that depends on it, and an indirect
    # dependency can vanish under an upstream release with no warning.
    "numpy>=2.0",
    "parakeet-mlx>=0.5.2",
    "pydantic>=2.13.4",
    # Already present transitively via parakeet-mlx, which is exactly why it
    # gets declared: a transitive dependency can vanish under an upstream
    # release with no warning, and cli.py imports it directly.
    "typer>=0.20",
]

# The reachable surface. Until this existed, pulling a frame out of a video
# meant importing jaano.media from Python -- and frame retrieval is the step
# measured to take an agent from 5/16 to 16/16 (docs/do-marks-help.md). A
# capability nothing can invoke is a capability nobody has.
[project.scripts]
jaano = "jaano.cli:main"

# An installed copy has no repository beside it. Without these, `pip show jaano`
# on someone else's machine points nowhere.
[project.urls]
Homepage = "https://github.com/m2moiz/jaano"
Source = "https://github.com/m2moiz/jaano"
Issues = "https://github.com/m2moiz/jaano/issues"

[project.optional-dependencies]
diarize = [
    "senko>=0.1.0,<0.2",
]

[dependency-groups]
dev = [
    "mutmut>=3.7.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling's default sdist is "everything git does not ignore", and that is not
# what this repo is. It swept in a 1.29 MB graphify-out/ and Dolt backups
# against 11 files of package, and it swept in .codegraph -- an absolute symlink
# into ~/.omo, which uv refuses to unpack, so `uv build` failed outright. Only
# `uv build --wheel` worked, which is why the git install kept working and the
# breakage went unseen. List what ships instead of subtracting what does not.
[tool.hatch.build.targets.sdist]

# Leading slashes are load-bearing: these are gitignore-style patterns, so a
# bare `README.md` matched `.beads/README.md` too and pulled the tracker's docs
# into the archive. Anchor each one to the repo root.
include = [
    "/jaano",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/justfile",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["jaano"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --timeout=120 -m 'not slow'"
# Populated from an observed run (`pytest -W default`, 2026-08-06), not guessed:
# a filter for a category that never fires is a filter that does nothing. The
# only third-party noise is pynndescent's, reached through senko's clustering.
#
# ResourceWarning is deliberately NOT filtered. It is off by default in Python,
# so it only shows under `-W default` -- which is exactly how the unclosed
# ffmpeg pipe in media.extract_audio was found (jaano-3du, now fixed and
# regression-tested). What remains is upstream, in parakeet_mlx/utils.py.
# Filtering the category would have hidden ours along with theirs.
filterwarnings = [
    # No category qualifier: NumbaWarning does not subclass UserWarning, and
    # naming a category we cannot import here would silently match nothing --
    # measured, the qualified form left both of these firing.
    "ignore:Cannot cache compiled function",
]
# `-m "not slow"` carves the model-loading tests out of the default run. The
# argument that used to stand here -- "a test carved out of the default run is
# a test nobody observes" -- was right, and the suite it defended was itself
# unobserved: at 190s its summary line got buried three runs straight, so the
# result could not be read. The carve-out now has a NAMED OBSERVER rather than
# a habit: `just verify` runs everything and is the session-close gate, and CI
# runs the fast lane on every push once a remote exists.
markers = ["slow: loads the ASR model or the diarizer; run via `just verify`"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "D", "PTH", "ARG", "C4", "RET", "RUF"]
ignore = [
    "ANN401",  # `audio_data: Any` in chunking is deliberate: mlx array vs test double
]
# PL is deliberately absent: PLC0415 (import-outside-top-level) flags 34 sites,
# and the function-local imports here are load-bearing -- they keep an optional
# extra out of the import path. Selecting PL would mean 60+ suppressions
# defending an intentional design.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# ANN is deliberately NOT ignored for tests: Phase 3b puts them under pyright
# strict, which demands the same annotations. Doing that work twice, against two
# tools, would be incoherent -- so the ANN batch is deferred to 3b and done once.
"tests/**" = ["D1", "ARG"]
# scratch/*.py is tracked code (working probes, not shipped), so ruff lints it.
# Fix the mechanical ones; ignore the classes that do not matter in a probe.
"scratch/**" = ["ANN", "D", "ARG", "B905", "E501", "SIM115", "PTH123"]

[tool.mutmut]
# Keys verified against mutmut 3.7.0's own configuration.py, not against a
# plan or a docs page: `paths_to_mutate` and `tests_dir` are 2.x names that
# 3.x still reads but warns about. These are the current ones.
source_paths = ["jaano"]

# Scoped to the three PURE modules. They are ~150 statements, they are where
# the audit's covered-but-unasserted defects actually lived, and their tests
# run entirely on fakes.
#
# chunking.py is deliberately EXCLUDED even though it is pure. Its exercising
# tests (tests/test_chunking.py) are all slow-marked, so under the fast lane
# transcribe_chunked has zero tests running against it -- every mutant there
# would "survive" by construction and the report would be misleading for a
# quarter of its own scope. transcribe.py and media.py are excluded for the
# ordinary reason: their tests are integration-shaped and mutants time out
# rather than inform.
only_mutate = ["jaano/merge.py", "jaano/checkpoint.py", "jaano/atomic.py"]

# Explicit, not inherited. Whether mutmut's fork-based runner picks up pytest's
# addopts is documented nowhere either way, and the whole tractability argument
# rests on each mutant being checked by a seconds-long suite rather than a
# 20-minute one. State it rather than hope.
pytest_add_cli_args = ["-m", "not slow", "-p", "no:randomly", "-x", "-q"]
