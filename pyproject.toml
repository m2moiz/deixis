[project]
name = "deixis"
version = "0.1.0"
description = "Make a long screen recording answerable: a timestamped transcript indexes the video, frames are retrieved on demand."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.61",
    "parakeet-mlx>=0.5.2",
]

[project.optional-dependencies]
diarize = [
    "senko>=0.1.0,<0.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

# pythonpath is load-bearing, not cosmetic: there is no [build-system], so uv
# treats deixis as a virtual project and never installs the package into .venv.
# Without this, `import deixis` fails from a test file.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
# Registered, not deselected: --strict-markers turns an unknown mark into a
# collection error, and a test carved out of the default run is a test nobody
# observes. `-m "not slow"` is there for anyone who wants the fast loop.
markers = ["slow: loads the ASR model"]
