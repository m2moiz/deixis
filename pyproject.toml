[project]
name = "deixis"
version = "0.1.0"
description = "Make a long screen recording answerable: a timestamped transcript indexes the video, frames are retrieved on demand."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.61",
    "parakeet-mlx>=0.5.2",
]

[project.optional-dependencies]
diarize = [
    "senko>=0.1.0,<0.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --timeout=120"
# Populated from an observed run (`pytest -W default`, 2026-08-06), not guessed:
# a filter for a category that never fires is a filter that does nothing. The
# only third-party noise is pynndescent's, reached through senko's clustering.
#
# ResourceWarning is deliberately NOT filtered. It fires from transcribe.py:275
# and test_media.py, and it points at an unclosed file in our own code -- that
# is a defect to fix, not noise to hide. Tracked in a bead.
filterwarnings = [
    # No category qualifier: NumbaWarning does not subclass UserWarning, and
    # naming a category we cannot import here would silently match nothing --
    # measured, the qualified form left both of these firing.
    "ignore:Cannot cache compiled function",
]
# Registered, not deselected: --strict-markers turns an unknown mark into a
# collection error, and a test carved out of the default run is a test nobody
# observes. `-m "not slow"` is there for anyone who wants the fast loop.
markers = ["slow: loads the ASR model"]
