name: ci

# DORMANT AS COMMITTED. This repository has no git remote (`git remote -v` is
# empty), so nothing here has ever run. Every step below was executed locally
# in sequence and is green, and the action versions were checked against their
# published releases -- but "expected to pass" is the strongest honest claim
# available, and the first real run is the observation. A bead tracks watching
# it.

on:
  push:
  pull_request:

jobs:
  check:
    # macos-14 is the Apple Silicon runner. parakeet-mlx requires MLX, which is
    # Metal-backed, so a Linux runner cannot even import the package. Confirmed
    # still current and not deprecated.
    runs-on: macos-14

    steps:
      # Exact tags, both verified to resolve against the GitHub API. The first
      # push failed here: `astral-sh/setup-uv@v9` does not exist -- astral
      # publish releases up to v9.0.0 but only a v7 FLOATING major tag, so @v9
      # is unresolvable. Pinning the release tag is also the safer form: a
      # floating major silently changes under you.
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --extra diarize is REQUIRED, not optional polish. Extras are opt-in, so
      # a bare `uv sync` leaves senko out -- and three tests in
      # tests/test_diarize.py then FAIL rather than skip: the bare ModuleType
      # stand-in satisfies `import senko`, but diarize.py's _provenance() calls
      # importlib.metadata.version("senko"), which needs real distribution
      # metadata and raises PackageNotFoundError. Observed locally on
      # 2026-08-06 when a plain `uv sync` silently uninstalled senko's tree.
      # ffmpeg is NOT on the macos-14-arm64 runner image. Without it,
      # tests/test_media.py skips at module level and two more tests skip
      # individually -- 14 in total, and the ENTIRE ffmpeg/ingestion boundary
      # goes unexercised while the run still reports success. Observed on the
      # first green run: "102 passed, 14 skipped" against 116 locally.
      # A skip that looks like a pass is the exact failure this project exists
      # to remove, so install it rather than accept the gap.
      - run: brew install ffmpeg

      - run: uv sync --dev --extra diarize

      # From PyPI rather than a third-party action or a piped install script.
      # rust-just 1.58.0 publishes a macosx_11_0_arm64 wheel, checked against
      # the package index.
      - run: uv tool install rust-just

      # ONE command, the same one a human and a coding agent run locally, so a
      # green here means what a green there means. Anything CI checks that
      # `just check` does not would be a way for the two to drift.
      #
      # This is the FAST lane. The slow tests need ~2.4 GB of model weights and
      # 146 MB of reference audio that lives in gitignored scratch/, so they
      # cannot run here at all -- and they do not silently pass either: they are
      # deselected by the marker, which shows in the summary line as a count.
      # The slow lane's observer is `just verify`, run locally at session close.
      - run: just check

      # A green `just check` is not enough on its own: a skipped test and a
      # passing test look identical in an exit code. Assert the count so a
      # missing system dependency cannot quietly shrink the suite again.
      - name: no test may silently skip
        run: |
          # NOT `pytest -q`: addopts already carries -q, so a second one
          # makes -qq and pytest suppresses the summary line entirely --
          # the guard then fails on a run where nothing was wrong.
          uv run pytest 2>&1 | tail -3 | tee /tmp/summary
          grep -qE '^116 passed, 11 deselected' /tmp/summary || {
            echo "::error::fast lane is not 116 passed / 11 deselected -- something skipped"
            exit 1
          }
