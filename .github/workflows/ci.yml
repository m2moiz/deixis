name: ci

# NO LONGER DORMANT. Runs on github.com/m2moiz/jaano since 2026-08-06.
#
# The first three runs are why this file could not be trusted until it ran:
#   1. FAILED in 8s   -- astral-sh/setup-uv@v9 does not resolve (releases go to
#                        v9.0.0 but only a v7 floating major tag is published).
#   2. "PASSED" in 79s -- and ran 14 FEWER tests than a local run. ffmpeg is not
#                        on the macos-14-arm64 image, so the whole ingestion
#                        boundary skipped and the badge went green anyway.
#   3. FAILED          -- the skip-guard added for (2) ran `pytest -q` on top of
#                        an addopts that already had -q, making -qq, which
#                        suppresses the summary line it greps for.
# Every one was invisible to local step-verification, yamllint, and a live
# check of the action versions.

on:
  push:
  pull_request:
  # Manual trigger. A forced update does not always fire `push`, and after a
  # history rewrite that is exactly when you most want to re-run the gate.
  workflow_dispatch:

jobs:
  check:
    # macos-14 is the Apple Silicon runner. parakeet-mlx requires MLX, which is
    # Metal-backed, so a Linux runner cannot even import the package. Confirmed
    # still current and not deprecated.
    runs-on: macos-14

    steps:
      # Exact tags, both verified to resolve against the GitHub API. The first
      # push failed here: `astral-sh/setup-uv@v9` does not exist -- astral
      # publish releases up to v9.0.0 but only a v7 FLOATING major tag, so @v9
      # is unresolvable. Pinning the release tag is also the safer form: a
      # floating major silently changes under you.
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --extra diarize is REQUIRED, not optional polish. Extras are opt-in, so
      # a bare `uv sync` leaves senko out -- and three tests in
      # tests/test_diarize.py then FAIL rather than skip: the bare ModuleType
      # stand-in satisfies `import senko`, but diarize.py's _provenance() calls
      # importlib.metadata.version("senko"), which needs real distribution
      # metadata and raises PackageNotFoundError. Observed locally on
      # 2026-08-06 when a plain `uv sync` silently uninstalled senko's tree.
      # ffmpeg is NOT on the macos-14-arm64 runner image. Without it,
      # tests/test_media.py skips at module level and two more tests skip
      # individually -- 14 in total, and the ENTIRE ffmpeg/ingestion boundary
      # goes unexercised while the run still reports success. Observed on the
      # first green run: "102 passed, 14 skipped" against 116 locally.
      # A skip that looks like a pass is the exact failure this project exists
      # to remove, so install it rather than accept the gap.
      - run: brew install ffmpeg

      # --extra whisper is here for pyright, not for pytest. Every fast test of
      # the whisper engine stubs mlx-whisper, so the suite passes without it --
      # but `jaano/whisper.py` imports it, and pyright under strict reports an
      # unresolved import as an error, which is exactly what the first CI run
      # of that file did. Installing it costs a torch download on a cold cache;
      # the alternative is suppressing a real unresolved-import diagnostic that
      # would then also hide a genuinely broken import.
      - run: uv sync --dev --extra diarize --extra whisper

      # From PyPI rather than a third-party action or a piped install script.
      # rust-just 1.58.0 publishes a macosx_11_0_arm64 wheel, checked against
      # the package index.
      - run: uv tool install rust-just

      # ONE command, the same one a human and a coding agent run locally, so a
      # green here means what a green there means. Anything CI checks that
      # `just check` does not would be a way for the two to drift.
      #
      # This is the FAST lane. The slow tests need ~2.4 GB of model weights and
      # 146 MB of reference audio that lives in gitignored scratch/, so they
      # cannot run here at all -- and they do not silently pass either: they are
      # deselected by the marker, which shows in the summary line as a count.
      # The slow lane's observer is `just verify`, run locally at session close.
      - run: just check

      # A green `just check` is not enough on its own: a skipped test and a
      # passing test look identical in an exit code. Assert the count so a
      # missing system dependency cannot quietly shrink the suite again.
      # An exact count stood here -- `116 passed, 11 deselected` -- and it was
      # WRONG almost immediately. It went stale the first time a test was added
      # and CI went red on main on 2026-08-06 reporting "something skipped" for
      # a run with 129 passed and zero skipped. A guard that cries wolf on every
      # legitimate addition gets muted, which would cost the real signal.
      #
      # So assert the INVARIANT rather than a magic number. The hazard is a
      # skipped test looking like a passing one -- the first green run here was
      # "102 passed, 14 skipped" with ffmpeg missing and the whole ingestion
      # boundary unexercised. `skipped` appearing at all is that hazard, exactly,
      # and needs no maintenance. The floor catches the other direction, a suite
      # that shrinks; raise it when tests are added, and note that forgetting to
      # is harmless where forgetting to bump an exact count was not.
      - name: no test may silently skip
        run: |
          # NOT `pytest -q`: addopts already carries -q, so a second one
          # makes -qq and pytest suppresses the summary line entirely --
          # the guard then fails on a run where nothing was wrong.
          uv run pytest 2>&1 | tail -3 | tee /tmp/summary
          # `if`, not `grep && { }`: the shell runs with -e, and a compound
          # ending in a failed grep would abort the step on the healthy path.
          if grep -q 'skipped' /tmp/summary; then
            echo "::error::a test SKIPPED -- a system dependency is missing on the runner"
            exit 1
          fi
          passed=$(grep -oE '[0-9]+ passed' /tmp/summary | grep -oE '^[0-9]+')
          if [ "${passed:-0}" -lt 219 ]; then
            echo "::error::fast lane is ${passed:-no} passed, floor is 219 -- the suite shrank"
            exit 1
          fi
